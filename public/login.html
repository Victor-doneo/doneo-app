<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Doneo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 40px 36px;
      width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,.1);
    }
    .logo { font-size: 1.8rem; font-weight: 800; color: #1a1a2e; text-align: center; margin-bottom: 4px; }
    .logo span { color: #e63946; }
    .subtitle { text-align: center; color: #6b7280; font-size: .9rem; margin-bottom: 32px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: .85rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 10px;
      font-size: 1rem; transition: border-color .2s;
    }
    input:focus { outline: none; border-color: #1a1a2e; }
    .btn {
      width: 100%; padding: 14px; background: #1a1a2e; color: #fff;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: 700;
      cursor: pointer; margin-top: 8px; transition: background .15s;
    }
    .btn:hover { background: #2d2d4e; }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .error {
      background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
      padding: 10px 14px; border-radius: 8px; font-size: .875rem;
      margin-top: 12px; display: none;
    }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Doneo <span>·</span> CChezVous</div>
    <div class="subtitle">Contrôle des tournées</div>

    <div class="form-group">
      <label>Nom d'utilisateur</label>
      <input type="text" id="username" placeholder="Ex : jean.dupont" autocomplete="username" autocapitalize="none">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" onclick="login()">Se connecter</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <script>
    // Redirect if already logged in
    const token = localStorage.getItem('doneo_token');
    const role = localStorage.getItem('doneo_role');
    if (token) {
      if (role === 'admin') window.location.href = '/admin.html';
      else window.location.href = '/operateur.html';
    }

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');
      err.style.display = 'none';

      if (!username || !password) {
        err.textContent = 'Veuillez remplir tous les champs.';
        err.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Connexion...';

      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await r.json();

        if (data.error) {
          err.textContent = data.error;
          err.style.display = 'block';
        } else {
          localStorage.setItem('doneo_token', data.token);
          localStorage.setItem('doneo_role', data.role);
          localStorage.setItem('doneo_username', data.username);
          if (data.role === 'admin') window.location.href = '/admin.html';
          else window.location.href = '/operateur.html';
        }
      } catch (e) {
        err.textContent = 'Erreur de connexion au serveur.';
        err.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Se connecter';
    }

    document.getElementById('password').addEventListener('keypress', e => {
      if (e.key === 'Enter') login();
    });
    document.getElementById('username').addEventListener('keypress', e => {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });
  </script>
</body>
</html>
